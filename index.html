<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fakta atau Hoaks Sains</title>
<style>
  :root {
    --bg1:#071422;
    --bg2:#0b2a3a;
    --card:rgba(10,24,40,.78);
    --ink:#eef7ff;
    --muted:#9cb4c9;
    --line:rgba(130,200,230,.22);
    --cyan:#4de0ff;
    --lime:#9dff7a;
  }
  body.light {
    --bg1:#e8f4ff;
    --bg2:#f3fbff;
    --card:rgba(255,255,255,.86);
    --ink:#102033;
    --muted:#4e6478;
    --line:rgba(20,60,90,.12);
    --cyan:#0277bd;
    --lime:#2e7d32;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 8%, rgba(77,224,255,.18), transparent 28%),
      radial-gradient(circle at 88% 0%, rgba(157,255,122,.12), transparent 26%),
      linear-gradient(180deg,var(--bg1),var(--bg2));
    padding:16px 14px 28px;
  }
  .stars{
    position:fixed;inset:0;pointer-events:none;opacity:.35;
    background-image:
      radial-gradient(1px 1px at 10% 20%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 30% 70%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 70% 30%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 85% 80%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 50% 50%, #fff 50%, transparent 51%);
  }
  body.light .stars{opacity:.12}
  .app{
    position:relative;z-index:1;max-width:720px;margin:0 auto;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    padding:20px 18px 24px;
    backdrop-filter:blur(14px);
    box-shadow:0 18px 50px rgba(0,0,0,.25);
  }
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pill{
    border:1px solid var(--line);background:transparent;color:var(--ink);
    border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer;
  }
  h1{font-size:clamp(26px,7vw,40px);line-height:1.15;margin:14px 0 8px}
  .sub{color:var(--muted);margin:0 0 18px;line-height:1.55}
  label{display:block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  input{
    width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:inherit;font-size:16px;margin-bottom:8px;
  }
  input.invalid{border-color:#ff5d73}
  .err{color:#ff9aa8;font-size:13px;font-weight:700;min-height:18px;margin:0 0 8px}
  body.light .err{color:#c62828}
  .btn{
    width:100%;border:0;border-radius:16px;padding:15px 16px;margin:8px 0 0;
    font-size:17px;font-weight:800;cursor:pointer;color:#062018;
    background:linear-gradient(135deg,var(--cyan),var(--lime));
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .fact{background:linear-gradient(135deg,#1dbf73,#9dff7a);color:#062018}
  .hoax{background:linear-gradient(135deg,#ff5d73,#ff9aa8);color:#2a060c}
  .ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-weight:700;font-size:14px}
  .q{font-size:clamp(22px,6.2vw,34px);line-height:1.3;margin:16px 0 18px}
  .bar{height:10px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin:10px 0 6px}
  body.light .bar{background:rgba(0,0,0,.08)}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--lime));transition:width .2s linear}
  .clock{font-variant-numeric:tabular-nums;font-weight:800;color:var(--cyan)}
  .box{margin-top:14px;padding:14px;border-radius:16px;border:1px solid var(--line)}
  .ok{border-color:rgba(46,229,157,.5);background:rgba(46,229,157,.12)}
  .bad{border-color:rgba(255,93,115,.5);background:rgba(255,93,115,.12)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 18px}
  .stat{border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
  .stat b{display:block;font-size:24px}
  .item{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
  .muted{color:var(--muted)}
  @media (min-width:640px){
    .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .app{padding:28px}
  }
</style>
</head>
<body>
<div class="stars"></div>
<div class="app" id="app">Memuat...</div>
<script>
(function(){
  function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  var T = {
    id:{title:"Fakta atau Hoaks Sains",sub:"Tentukan apakah pernyataan berikut fakta ilmiah atau hoaks. Setiap soal 30 detik.",name:"Nama",start:"Mulai Kuis",fact:"FAKTA",hoax:"HOAKS",next:"Soal berikutnya",result:"Hasil kuis",review:"Tinjau jawaban",again:"Main lagi",home:"Beranda",dark:"Mode gelap",light:"Mode terang",timeout:"Waktu habis",correct:"Benar",wrong:"Belum tepat",needName:"Masukkan nama terlebih dahulu."},
    en:{title:"Science Fact or Hoax",sub:"Decide whether each statement is a scientific fact or a hoax. Every question has 30 seconds.",name:"Name",start:"Start Quiz",fact:"FACT",hoax:"HOAX",next:"Next question",result:"Quiz results",review:"Review answers",again:"Play again",home:"Home",dark:"Dark mode",light:"Light mode",timeout:"Time is up",correct:"Correct",wrong:"Not quite",needName:"Please enter your name first."}
  };
  var BANK = [
    ["Manusia hanya menggunakan 10% otaknya.","Humans only use 10% of their brain.","Hoaks","Penelitian menunjukkan hampir seluruh bagian otak memiliki fungsi tertentu dan digunakan dalam berbagai aktivitas sehari-hari. Tidak ada bukti ilmiah bahwa manusia hanya menggunakan 10% kapasitas otaknya.","Research shows nearly all parts of the brain have specific functions and are used in everyday activity. There is no scientific evidence that humans use only 10% of the brain."],
    ["Petir tidak pernah menyambar tempat yang sama dua kali.","Lightning never strikes the same place twice.","Hoaks","Petir justru sering menyambar tempat yang sama berulang kali, terutama objek tinggi seperti menara, gedung, atau pohon besar.","Lightning often strikes the same place repeatedly, especially tall objects such as towers, buildings, or large trees."],
    ["Kelelawar adalah mamalia.","Bats are mammals.","Fakta","Kelelawar melahirkan, menyusui anaknya, dan memiliki rambut, sehingga termasuk kelompok mamalia.","Bats give birth, nurse their young, and have hair, so they are mammals."],
    ["Semua bakteri berbahaya bagi manusia.","All bacteria are harmful to humans.","Hoaks","Banyak bakteri yang bermanfaat, misalnya membantu pencernaan di usus manusia dan digunakan dalam pembuatan yoghurt serta keju.","Many bacteria are beneficial, for example in human digestion and in making yogurt and cheese."],
    ["Air mendidih selalu pada suhu 100°C.","Water always boils at 100°C.","Hoaks","Air mendidih pada suhu 100°C di permukaan laut. Di daerah pegunungan yang tekanannya lebih rendah, air dapat mendidih pada suhu di bawah 100°C.","Water boils at 100°C at sea level. In the mountains, where air pressure is lower, water can boil below 100°C."],
    ["Tumbuhan menghasilkan oksigen melalui proses fotosintesis.","Plants produce oxygen through photosynthesis.","Fakta","Dalam proses fotosintesis, tumbuhan menggunakan karbon dioksida dan air untuk menghasilkan makanan dan melepaskan oksigen ke udara.","In photosynthesis, plants use carbon dioxide and water to make food and release oxygen into the air."],
    ["Bunglon berubah warna hanya untuk menyamarkan diri.","Chameleons change color only to camouflage.","Hoaks","Bunglon juga mengubah warna tubuhnya untuk berkomunikasi, mengatur suhu tubuh, dan mengekspresikan kondisi fisiologis tertentu.","Chameleons also change color to communicate, regulate body temperature, and express physiological states."],
    ["Paus adalah ikan.","Whales are fish.","Hoaks","Paus bernapas menggunakan paru-paru, melahirkan, dan menyusui anaknya, sehingga termasuk mamalia, bukan ikan.","Whales breathe with lungs, give birth, and nurse their young, so they are mammals, not fish."],
    ["Planet Venus lebih panas daripada Merkurius.","Venus is hotter than Mercury.","Fakta","Walaupun Merkurius lebih dekat ke Matahari, Venus memiliki atmosfer yang sangat tebal sehingga panas terperangkap dan suhu permukaannya menjadi lebih tinggi.","Although Mercury is closer to the Sun, Venus has a very thick atmosphere that traps heat, so its surface is hotter."],
    ["Cacing tanah membantu menyuburkan tanah.","Earthworms help fertilize the soil.","Fakta","Cacing tanah membuat rongga-rongga dalam tanah yang meningkatkan sirkulasi udara dan membantu penguraian bahan organik.","Earthworms create tunnels that improve air circulation and help break down organic matter."],
    ["Minum es menyebabkan flu.","Drinking ice water causes the flu.","Hoaks","Flu disebabkan oleh infeksi virus, bukan karena minum air es. Air es mungkin membuat tenggorokan terasa kurang nyaman, tetapi bukan penyebab utama flu.","The flu is caused by a virus, not by drinking ice water. Cold drinks may feel uncomfortable in the throat, but they are not the main cause of flu."],
    ["Wortel dapat meningkatkan kemampuan melihat dalam gelap.","Carrots can improve the ability to see in the dark.","Hoaks","Wortel mengandung vitamin A yang penting untuk kesehatan mata. Namun, makan wortel tidak membuat seseorang memiliki kemampuan melihat dalam gelap seperti kucing.","Carrots contain vitamin A, which is important for eye health. Eating carrots does not give someone night vision like a cat."]
  ];
  var lang = lsGet("sfh_lang") || "id";
  var dark = lsGet("sfh_dark") !== "0";
  var state = {};
  var timerId = null;
  var LIMIT = 30;
  var app = document.getElementById("app");
  function t(k){ return T[lang][k]; }
  function applyTheme(){ document.body.classList.toggle("light", !dark); }
  applyTheme();
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }
  function getName(){
    var el = document.getElementById("n");
    return el ? (el.value || "").trim() : "";
  }
  function setNameError(show){
    var err = document.getElementById("nameErr");
    var input = document.getElementById("n");
    var go = document.getElementById("go");
    if(err) err.textContent = show ? t("needName") : "";
    if(input) input.classList.toggle("invalid", !!show);
    if(go) go.disabled = !getName();
  }
  function home(){
    clearInterval(timerId);
    app.innerHTML =
      '<div class="top">'+
        '<button class="pill" id="themeBtn">'+(dark?t("light"):t("dark"))+'</button>'+
        '<button class="pill" id="langBtn">'+(lang==="id"?"EN":"ID")+'</button>'+
      '</div>'+
      '<h1>'+t("title")+'</h1>'+
      '<p class="sub">'+t("sub")+'</p>'+
      '<label for="n">'+t("name")+'</label>'+
      '<input id="n" maxlength="40" required placeholder="'+(lang==="id"?"Nama Anda":"Your name")+'">'+
      '<p class="err" id="nameErr"></p>'+
      '<button class="btn" id="go" disabled>'+t("start")+'</button>';
    document.getElementById("themeBtn").onclick = function(){
      dark = !dark; lsSet("sfh_dark", dark ? "1" : "0"); applyTheme(); home();
    };
    document.getElementById("langBtn").onclick = function(){
      lang = lang==="id" ? "en" : "id"; lsSet("sfh_lang", lang); home();
    };
    var input = document.getElementById("n");
    input.addEventListener("input", function(){ setNameError(false); });
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter") document.getElementById("go").click();
    });
    document.getElementById("go").onclick = function(){
      var name = getName();
      if(!name){
        setNameError(true);
        input.focus();
        return;
      }
      state = {name:name,i:0,score:0,c:0,w:0,skip:0,qs:shuffle(BANK),log:[]};
      quiz();
    };
  }
  function quiz(){
    clearInterval(timerId);
    if(state.i >= state.qs.length){ end(); return; }
    var q = state.qs[state.i];
    var total = state.qs.length;
    app.innerHTML =
      '<div class="meta"><span>'+state.name+'</span><span>'+(state.i+1)+'/'+total+' · '+state.score+'</span></div>'+
      '<div class="bar"><div class="fill" id="f"></div></div>'+
      '<div class="clock" id="clock">30</div>'+
      '<h2 class="q">'+(lang==="id"?q[0]:q[1])+'</h2>'+
      '<div class="pair">'+
        '<button class="btn fact" id="bf">'+t("fact")+'</button>'+
        '<button class="btn hoax" id="bh">'+t("hoax")+'</button>'+
      '</div>'+
      '<div id="explain"></div>';
    document.getElementById("bf").onclick = function(){ answer("Fakta"); };
    document.getElementById("bh").onclick = function(){ answer("Hoaks"); };
    var left = LIMIT;
    var fill = document.getElementById("f");
    timerId = setInterval(function(){
      left--;
      var c = document.getElementById("clock");
      if(c) c.textContent = left;
      if(fill) fill.style.width = ((LIMIT-left)/LIMIT*100)+"%";
      if(left<=0) answer("");
    },1000);
  }
  function answer(v){
    clearInterval(timerId);
    var q = state.qs[state.i];
    var ok = v === q[2];
    if(!v) state.skip++;
    else if(ok){ state.score += 10; state.c++; }
    else state.w++;
    state.log.push({q:q,v:v||"-",ok:ok});
    var box = document.getElementById("explain");
    if(!box) return;
    var title = ok ? t("correct") : (v ? t("wrong") : t("timeout"));
    box.innerHTML = '<div class="box '+(ok?"ok":"bad")+'"><h3>'+title+'</h3><p>'+(lang==="id"?q[3]:q[4])+'</p><button class="btn" id="nx">'+t("next")+'</button></div>';
    var bf=document.getElementById("bf"), bh=document.getElementById("bh");
    if(bf) bf.disabled = true;
    if(bh) bh.disabled = true;
    document.getElementById("nx").onclick = function(){ state.i++; quiz(); };
  }
  function end(){
    var acc = Math.round((state.c/state.qs.length)*100)||0;
    var html = '<h2>'+t("result")+'</h2><p class="muted">'+state.name+'</p>';
    html += '<div class="stats"><div class="stat"><b>'+state.score+'</b>Skor</div><div class="stat"><b>'+acc+'%</b>'+(lang==="id"?"Akurasi":"Accuracy")+'</div><div class="stat"><b>'+state.c+'</b>'+(lang==="id"?"Benar":"Correct")+'</div><div class="stat"><b>'+state.w+'</b>'+(lang==="id"?"Salah":"Wrong")+'</div></div>';
    html += '<h3>'+t("review")+'</h3>';
    for(var i=0;i<state.log.length;i++){
      var item=state.log[i], q=item.q;
      html += '<div class="item"><div class="muted">'+(i+1)+'. '+(item.ok?(lang==="id"?"Benar":"Correct"):(lang==="id"?"Keliru":"Incorrect"))+' · '+(lang==="id"?"Jawaban":"Answer")+': '+item.v+' · '+(lang==="id"?"Kunci":"Key")+': '+q[2]+'</div><b>'+(lang==="id"?q[0]:q[1])+'</b><div class="muted">'+(lang==="id"?q[3]:q[4])+'</div></div>';
    }
    html += '<button class="btn" id="again">'+t("again")+'</button>';
    html += '<button class="btn ghost" id="back">'+t("home")+'</button>';
    app.innerHTML = html;
    document.getElementById("again").onclick = function(){
      state = {name:state.name,i:0,score:0,c:0,w:0,skip:0,qs:shuffle(BANK),log:[]};
      quiz();
    };
    document.getElementById("back").onclick = home;
  }
  home();
})();
</script>
</body>
</html>
